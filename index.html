<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nanogames</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header class="header">
      <div class="header-content">
        <div class="title-wrap">
          <p class="eyebrow">CR0CKE HUB</p>
          <h1>Nanogames</h1>
          <p class="subtitle">Mini-Games und Web-Projekte</p>
        </div>

        <button id="refreshButton" class="refresh-button" title="Seiten neu laden" aria-label="Seiten neu laden">
          ⟳
        </button>
      </div>
    </header>

    <main class="container">
      <div class="toolbar">
        <div class="search-container">
          <span class="search-icon">⌕</span>
          <input
            type="search"
            id="searchInput"
            placeholder="Spiele durchsuchen..."
            autocomplete="off"
          />
        </div>

        <button id="favoritesFilterButton" class="favorites-filter" type="button" aria-pressed="false">
          <span aria-hidden="true">☆</span>
          Favoriten
          <span id="favoritesCount" class="favorites-count">0</span>
        </button>

        <div id="pageCount" class="page-count">Lade Spiele...</div>
      </div>

      <div id="loading" class="status">
        <div class="loader"></div>
        <p>Arsenal wird geladen...</p>
      </div>

      <div id="error" class="status error hidden">
        <div class="status-icon">!</div>
        <h2>Seiten konnten nicht geladen werden</h2>
        <p id="errorMessage">Es ist ein Fehler aufgetreten.</p>
        <button id="retryButton" class="retry-button">Erneut versuchen</button>
      </div>

      <div id="empty" class="status hidden">
        <div class="status-icon">○</div>
        <h2>Keine Spiele gefunden</h2>
        <p>Im Ordner <code>games/</code> wurden keine HTML-Dateien gefunden.</p>
      </div>

      <section id="pageGrid" class="page-grid"></section>
    </main>

    <footer class="footer">
      <p><span id="lastUpdated">Zuletzt aktualisiert: –</span></p>
    </footer>

    <script src="dashboard.js"></script>
  </body>
</html>
